# Enterprise audit configuration — edit to match your portfolio.
# Honesty model: anything labelled ESTIMATED is a range/assumption, never a measured fact.
audit:
  max_hops: 12
  timeout_seconds: 20
  connect_timeout_seconds: 10
  concurrency: 8
  max_connections: 50
  http2: true
  retries: 2
  retry_backoff_s: 0.8
  per_host_rps: 4
  execution_mode: hybrid        # http_only | hybrid (http + Playwright escalation on bot-wall/JS)
  user_agent_desktop: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36"
  user_agent_mobile_ios: "Mozilla/5.0 (iPhone; CPU iPhone OS 18_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.4 Mobile/15E148 Safari/604.1"
  user_agent_mobile_android: "Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Mobile Safari/537.36"
  # UA set Q3-2026 — rotate quarterly (stale UA is a bot signal). Canonical set lives in src/redirect_pathfinder/tls_client.py:ROTATING_UAS.
  deep_cross_device: auto
  deep_sample_n: 12           # P0 cost fix: on bulks >12, deep re-trace sampled to 12 rows (not 2× everything)
  screenshot_evidence: true
  probe_exit_ip: false        # set true to record VERIFIED egress IP per geo (Bright Data/Oxylabs/Smartproxy)
  crux_enabled: true          # P0: enabled by default; without CRUX_API_KEY returns honest {available:false}
  psi_enabled: true           # P0: enabled by default; without PSI_API_KEY uses keyless quota honestly
  tls_impersonation: chrome131  # P0: curl-cffi impersonate target (chrome131/safari18_0); httpx fallback

tracking_rules:
  required_param_patterns:
    - "(btag|affid|clickid|a_aid|cmp)"
    - "(subid|s1|s2|p1|sub_id)"
  promo_patterns:
    - "(promocode|promo|bonus|offer|gclid|dclid)"
  # Safari ITP / Firefox ETP strip these on cross-site bounce — simulate, don't just string-match
  itp_stripped_params: ["gclid", "fbclid", "msclkid", "dclid", "ttclid", "twclid"]
  network_mappings:
    bet365: ["incomeaccess", "bet365affiliates"]
    draftkings: ["everflow", "draftkings"]
    fanduel: ["everflow", "fanduel"]
    betmgm: ["cellxpert", "betmgm"]
    williamhill: ["netrefer", "williamhill"]
    caesars: ["cellxpert", "caesars"]

geo_profiles:
  US-NJ: { country: US, region: New_Jersey, currency: USD, age_gate: "21+", license: "NJ DGE", proxy_exit: "", min_age: 21 }
  US-PA: { country: US, region: Pennsylvania, currency: USD, age_gate: "21+", license: "PGCB", proxy_exit: "", min_age: 21 }
  US-MI: { country: US, region: Michigan, currency: USD, age_gate: "21+", license: "MGCB", proxy_exit: "", min_age: 21 }
  US-OH: { country: US, region: Ohio, currency: USD, age_gate: "21+", license: "OCCC", proxy_exit: "", min_age: 21 }
  US-MA: { country: US, region: Massachusetts, currency: USD, age_gate: "21+", license: "MGC", proxy_exit: "", min_age: 21 }
  UK:    { country: GB, region: London,    currency: GBP, age_gate: "18+", license: "UKGC", proxy_exit: "", min_age: 18 }
  CA-ON: { country: CA, region: Ontario,   currency: CAD, age_gate: "19+", license: "AGCO", proxy_exit: "", min_age: 19 }
  DE:    { country: DE, region: Berlin,    currency: EUR, age_gate: "18+", license: "GGL", proxy_exit: "", min_age: 18 }
  NL:    { country: NL, region: Amsterdam, currency: EUR, age_gate: "18+", license: "KSA", proxy_exit: "", min_age: 18 }
  # To make geo jurisdiction-pinned (real exit IPs), fill proxy_exit per geo, e.g.:
  #   proxy_exit: "http://user:pass@geo-proxy:8080"  (Bright Data / Oxylabs / Smartproxy)

compliance_packs:
  US-NJ: { required_strings: ["21+", "1-800-GAMBLER", "T&Cs Apply", "Gambling Problem"], license_badges: ["NJ DGE", "DGE"], min_age: 21, helpline: "1-800-GAMBLER" }
  US-PA: { required_strings: ["21+", "1-800-GAMBLER", "T&Cs Apply", "Gambling Problem"], license_badges: ["PGCB"], min_age: 21, helpline: "1-800-GAMBLER" }
  US-MI: { required_strings: ["21+", "1-800-270-7117", "T&Cs Apply", "Gambling Problem"], license_badges: ["MGCB"], min_age: 21, helpline: "1-800-270-7117" }
  US-OH: { required_strings: ["21+", "1-800-589-9966", "T&Cs Apply"], license_badges: ["OCCC"], min_age: 21, helpline: "1-800-589-9966" }
  US-MA: { required_strings: ["21+", "1-800-327-5050", "T&Cs Apply"], license_badges: ["MGC"], min_age: 21, helpline: "1-800-327-5050" }
  UK:    { required_strings: ["18+", "BeGambleAware.org", "T&Cs Apply", "GamStop"], license_badges: ["UKGC", "GamStop"], min_age: 18, helpline: "GamStop" }
  CA-ON: { required_strings: ["19+", "ConnexOntario", "T&Cs Apply"], license_badges: ["AGCO", "iGaming Ontario"], min_age: 19, helpline: "ConnexOntario" }
  DE:    { required_strings: ["18+", "Glücksspiel kann süchtig machen", "T&Cs Apply", "GGL"], license_badges: ["GGL"], min_age: 18, helpline: "BZgA" }
  NL:    { required_strings: ["18+", "Loket Kansspel", "T&Cs Apply", "KSA"], license_badges: ["KSA"], min_age: 18, helpline: "Loket Kansspel" }

latency:
  drop_off_threshold_ms: 1800
  warn_threshold_ms: 900
  # Honest model — redirect chain budget is NOT LCP/INP/CLS. CrUX/PSI numbers come only from Google APIs.
  dropoff_formula: "logistic anchored: <=500ms ~0-5%, 500-1800ms 5-35%, >1800ms 35-95% (ESTIMATED, industry bounce curve, not measured conversions)"
  redirect_budget_note: "Redirect-chain total_ms measures server+network hops only. Page CWV (LCP/INP/CLS) requires CrUX/PSI — see /utils/crux."

revenue:
  # No generic default: UNKNOWN until the user supplies EPC/clicks or imports affiliate/GA4 data.
  # epc_table_hint below is an EXAMPLE-ONLY estimator (±40%), NEVER a verified payout — UI must label ESTIMATED.
  default_epc: null
  default_clicks_30d: null
  epc_table_is_example_only: true
  revenue_basis_unknown_label: "UNKNOWN — supply EPC + clicks_30d, import affiliate CSV/API, or connect GA4"
  epc_table_hint:
    bet365: 1.85
    draftkings: 2.10
    fanduel: 2.00
    betmgm: 1.40

alerting:
  slack_webhook: ""
  teams_webhook: ""
  email_to: []
  break_on_high_value_clicks: 5000
  post_alerts: true

crawl:
  respect_robots: true
  max_depth: 3
  exclude_paths: ["/blog/", "/news/", "/wp-admin/"]
  include_affiliate_path_hints: ["/out/", "/go/", "/visit/", "/redirect", "btag", "affid", "clickid"]

soft404_phrases:
  - "promotion has expired"
  - "offer closed"
  - "offer has ended"
  - "page not found"
  - "no longer available"
  - "account migrated"
  - "brand has closed"
  - "404"

easylist:
  url: "https://easylist.to/easylist/easylist.txt"
  cache_ttl_hours: 168
  fallback_hosts: ["doubleclick.net", "googlesyndication.com", "track.", "/track"]

monitoring:
  db_path: "output/pathfinder.db"
  retention_runs: 90
  pg_dsn_env: "PATHFINDER_PG_DSN"   # P0: honor Postgres when set (SQLite is dev fallback)
  redis_env: "REDIS_URL"            # P0: job store primary when reachable

mcp:
  enabled: true
  endpoint: "/mcp"
  manifest: "/.well-known/mcp.json"

observability:
  metrics_endpoint: "/metrics"
  otel_endpoint_env: "OTEL_EXPORTER_OTLP_ENDPOINT"
  sentry_dsn_env: "SENTRY_DSN"

ssrf:
  max_fetch_mb: 5
  allowlist_env: "PATHFINDER_SSRF_ALLOWLIST"
  note: "private/loopback/link-local/169.254.169.254 blocked + DNS-rebinding check (see ssrf.py)"

compliance_feed_path: "config/compliance_feed.json"

security:
  api_keys: []
  cors_allow_origins: ["http://localhost:8099"]
  redact_query_params: ["btag", "affid", "clickid", "subid", "token", "key"]
