[project]
name = "igaming-redirect-pathfinder"
version = "3.1.0"
description = "Enterprise Outbound Affiliate Link Chain & Latency Tracker (iGaming-Redirect-Pathfinder) — F1-F11 engines, honest timing, GEO/AEO, MCP, monitoring"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "h2>=4.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "dnspython>=2.6",
  "tldextract>=5.0",
  "reportlab>=4.0",
  "playwright>=1.44",
  "curl-cffi>=0.10",
  "python-multipart>=0.0.9",
  "slowapi>=0.1.9",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.22", "anyio>=4.0"]
enterprise = ["prometheus-client>=0.20", "opentelemetry-api>=1.28", "opentelemetry-sdk>=1.28",
  "sentry-sdk>=2.0", "redis>=5.0", "google-analytics-data>=0.18", "google-api-python-client>=2.0"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
